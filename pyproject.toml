[project]
name = "Reactify"
version = "0.1"
description = "General-purpose reactivity detection using proton NMR spectra"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hessam Mehr", email = "Hessam.Mehr@glasgow.ac.uk" },
    { name = "Dario Caramelli", email = "Dario.Caramelli@glasgow.ac.uk" }
]
license = { text = "MIT" }
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "numpy>=2.1.3",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.19.0",
    "tqdm>=4.67.1",
]
urls = { Homepage = "https://github.com/croningp/Reactify" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
